[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "qldpc-codesign-explorer-api"
version = "0.1.0"
description = "Backend service for the qLDPC CoDesign Explorer"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.53.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest==9.1.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

